#==========#
# terminal #
#==========#
# what tmux pretends to BE for programs running inside it
set -g default-terminal "tmux-256color"
# what tmux believes the OUTER terminal can do. RGB = truecolor,
# cstyle = kitty can change cursor shape (nvim's insert-mode bar).
set -sa terminal-features ',xterm-kitty:cstyle,xterm-256color:RGB,tmux-256color:RGB'
# undercurls, for nvim LSP diagnostics. not in the tmux-256color terminfo.
set -as terminal-overrides ',*:Smulx=\E[4::%p1%d'

set -g allow-passthrough on   # let programs speak to kitty directly (image protocols)
set -g focus-events on        # nvim autoread / FocusGained fire correctly
set -s escape-time 10         # don't mistake a bare Esc for the start of a sequence
set -g mouse on               # click panes, drag borders, scroll
set -g set-clipboard on       # yanks reach the system clipboard via OSC 52

#=========#
# windows #
#=========#
set -g base-index 1           # windows start at 1, matching the Alt+N binds below
setw -g pane-base-index 1
set -g renumber-windows on    # close a middle window and leave no gap
set -g allow-rename on        # let programs rename the window they run in
setw -g aggressive-resize on  # size to the smallest client actually viewing a window

#========#
# prefix #
#========#
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix      # hit it twice to send a literal Ctrl-Space through
bind r source-file ~/.config/tmux/tmux.conf \; display "config reloaded"

#============#
# appearance #
#============#
set -g status-position top
set -g status-interval 5
set -g status-style 'fg=default bg=default'
set -g message-style 'fg=default,bg=default'
set -g message-command-style reverse

set -g status-justify absolute-centre
setw -g window-status-format "#I:#W"
setw -g window-status-current-format "#I:#W"
setw -g window-status-style 'fg=default'
setw -g window-status-current-style 'fg=green bold bg=default'

set -g pane-border-lines simple
set -g pane-border-style fg=colour241
set -g pane-active-border-style fg=colour39

bind b set -g status          # value omitted = toggle. hides the bar entirely.

#===================#
# panes and windows #
#===================#
# jump straight to a window. needs base-index 1 above to line up.
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n M-n select-window -t:+1   # next window
bind -n M-p select-window -t:-1   # previous window
bind -r ^   last-window           # prefix then ^ = back and forth

# move between panes. -n = no prefix, so Alt+h works bare.
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
# same thing behind the prefix. -r = repeatable, hold prefix once and tap hjkl.
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# resize, repeatable
bind -r H resize-pane -L 3
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 3

bind Enter   split-window -h   # -h = split into left/right
bind -n M-Enter split-window -h
bind t       new-window
bind -n M-t  new-window
bind x       kill-pane         # no confirmation, unlike tmux's default x
bind -n M-w  kill-pane
bind Q       kill-session

#===========#
# copy mode #
#===========#
setw -g mode-keys vi
bind v copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

bind e display-popup           # scratch shell in a floating window
