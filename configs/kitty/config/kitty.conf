enable_audio_bell no
window_padding_width 0 0 0 0
window_margin_width 0
resize_in_steps yes
font_size 13.0

# BEGIN_KITTY_THEME
# Wood
# include current-theme.conf
# END_KITTY_THEME

background #000000
background_opacity 0.90
background_image_layout scaled
background_tint 0.75

# BEGIN_KITTY_FONTS
font_family      family="Cascadia Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

# claude code can't read a modified Enter: it never asks for kitty's keyboard
# protocol, and nothing in it parses CSI 13;2u. what it does understand is
# Esc+CR (the Alt+Enter path), so we let tmux forward raw bytes verbatim (requires M-Enter to be unbound)
map shift+enter send_text all \x1b\r
