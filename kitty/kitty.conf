enable_audio_bell no
window_padding_width 0 0 0 0
window_margin_width 0
resize_in_steps yes
font_size 13.0

# BEGIN_KITTY_THEME
# Wood
include current-theme.conf
# END_KITTY_THEME

# background #000000
# background_image ~/dotfiles/resources/akame.jpg
background_image_layout scaled
background_tint 0.75

# BEGIN_KITTY_FONTS
font_family      family="Cascadia Code"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
